name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  query-tests:
    name: Query integration tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-querytests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-querytests-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify test DB and reads exist
        run: |
          set -e
          test -d data/influenza_test_db || (echo "Missing data/influenza_test_db" && exit 1)
          test -f data/influenza_test_db/db.meta || (echo "Missing db.meta in test DB" && exit 1)
          test -f data/influenza_test_db/db.mphf || (echo "Missing db.mphf in test DB" && exit 1)
          test -f data/influenza_test_db/db.fp || (echo "Missing db.fp in test DB" && exit 1)
          test -f data/influenza_test_db/db.taxid || (echo "Missing db.taxid in test DB" && exit 1)
          test -f data/influenza_test_db/db.taxmap || (echo "Missing db.taxmap in test DB" && exit 1)
          test -f data/test_reads/mock.fastq || (echo "Missing data/test_reads/mock.fastq" && exit 1)
          echo "All required test fixtures are present."
          ls -la data/influenza_test_db/
          ls -la data/test_reads/

      - name: Run query integration tests
        run: bash tests/run_query_tests.sh

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: query-test-output
          path: tests/_actual/
          if-no-files-found: ignore
          retention-days: 7