[package]
name = "kmer-db"
version = "0.1.0"
edition = "2021"
description = "Target Distilled K-mer Classifier"

[dependencies]
clap = { version = "4", features = ["derive"] }
boomphf = { version = "0.6", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
rayon = "1"
needletail = "0.6"
anyhow = "1"
dashmap = "6"
num_cpus = "1"
rustc-hash = "2"
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
crossbeam-channel = "0.5"
itertools = "0.12"
libc = "0.2"
memmap2 = "0.9"
fastbloom = { version = "0.17", features = ["serde"] }
hyperloglogplus = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1