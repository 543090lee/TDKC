[package]
name = "kmer-db"
version = "0.1.0"
edition = "2021"
description = "Distilled k-mer classifier using Kraken2-style minimizers"

[dependencies]
clap = { version = "4", features = ["derive"] }
boomphf = { version = "0.6", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
rayon = "1"
needletail = "0.6"
anyhow = "1"
dashmap = "6"
num_cpus = "1"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1